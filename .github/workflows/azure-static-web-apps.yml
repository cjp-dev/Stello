name: Deploy web version

on:
  push:
    branches: [ main ]
    paths:
      - 'Stello.Net/Stello.Web/**'
      - 'Stello.Net/Stello.App/**'
      - 'Stello.Net/Stello.Engine/**'
      - 'Stello C++/OPENING'
      - '.github/workflows/azure-static-web-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools

      - name: Publish (AOT)
        run: dotnet publish Stello.Net/Stello.Web/Stello.Web.csproj -c Release -o publish

      # The app is already built, so the action only uploads the static files.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          skip_app_build: true
          skip_api_build: true
