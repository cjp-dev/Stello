name: Deploy web version

on:
  push:
    branches: [ main ]
    paths:
      - 'Stello.Net/Stello.Web/**'
      - 'Stello.Net/Stello.App/**'
      - 'Stello.Net/Stello.Engine/**'
      - 'Stello.Cpp/**'
      - 'Stello.Net/Book/**'
      - 'docs/**'
      - 'Stello.Net/Images/**'
      - 'external/GameShell'
      - 'external/GameShell/**'
      - '.gitmodules'
      - '.github/workflows/azure-static-web-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # The shared GUI (GameShell) is a git submodule.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools

      # The engine in the browser is the C++ engine (Stello.Cpp), which Stello.Web compiles to single- and
      # multi-threaded WebAssembly with Emscripten via CMake + Ninja.
      - name: Install Ninja build tool
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Emscripten SDK
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '7.0.0'

      # StelloNativeEngine=false: the web app does not need Stello.Engine's native library (stello_engine).
      # StelloWasmThreads=required: the threaded engine must be built here (a local build without Emscripten only warns).
      - name: Publish (AOT)
        run: dotnet publish Stello.Net/Stello.Web/Stello.Web.csproj -c Release -o publish -p:StelloNativeEngine=false -p:StelloWasmThreads=required

      # The app is already built, so the action only uploads the static files.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          skip_app_build: true
