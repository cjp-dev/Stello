<text x="390" y="142" font-size="13" fill="#01579B">e1–h4: 2 empty (g1, h1)  → even</text>
<text x="390" y="164" font-size="13" fill="#8D6E00">a5–d8: 3 empty (a6, b6, b8)  → odd</text>
