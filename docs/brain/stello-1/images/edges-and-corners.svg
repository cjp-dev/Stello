<text x="548" y="340" font-size="13" fill="#000000">Each corner is the first or last</text>
<text x="548" y="358" font-size="13" fill="#000000">square of two edges:</text>
<text x="548" y="380" font-size="13" fill="#000000">a1: first of edges 0 and 3</text>
<text x="548" y="398" font-size="13" fill="#000000">h1: last of 0, first of 1</text>
<text x="548" y="416" font-size="13" fill="#000000">h8: last of 1 and 2</text>
