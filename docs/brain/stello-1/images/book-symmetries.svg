<text x="20" y="294" font-size="12" fill="#000000">Red: Black's first move. Yellow: the book reply. Blue: the mirror line, or the centre of the half turn, that maps the first move to d3.</text>
<text x="20" y="312" font-size="12" fill="#000000">Each symmetry keeps the start position and is its own inverse, so the same transform maps the book reply back to the real board.</text>
