<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="sans-serif">
<title>The four symmetries of the opening book</title>
<desc>Four boards. Black opens with d3, c4, f5 or e6 and the book replies c5, e3, d6 or f4. c4 is mapped to d3 by the main diagonal, f5 by the anti-diagonal and e6 by a half turn; each reply has the value -10.</desc>
