<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="sans-serif">
<title>Bitboard bit order and direction shifts</title>
<desc>A 64-bit number where bit 0 is a1 and bit 63 is h8, grouped by rows. Below, the eight neighbours of d4 with the shift that reaches each one, and the masks that stop wrap-around at columns a and h.</desc>
<rect x="0" y="0" width="800" height="440" fill="#FFFFFF"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#000000">One ulong per colour: bit n is square n</text>
<rect x="20" y="60" width="11" height="22" fill="#C8E6C9" stroke="#0B4D22" stroke-width="0.6"/>
<rect x="31" y="60" width="11" height="22" fill="#DCEFD9" stroke="#0B4D22" stroke-width="0.6"/>
