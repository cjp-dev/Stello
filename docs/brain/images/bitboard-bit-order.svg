<rect x="335" y="60" width="11" height="22" fill="#DCEFD9" stroke="#0B4D22" stroke-width="0.6"/>
<rect x="346" y="60" width="11" height="22" fill="#DCEFD9" stroke="#0B4D22" stroke-width="0.6"/>
<rect x="357" y="60" width="11" height="22" fill="#DCEFD9" stroke="#0B4D22" stroke-width="0.6"/>
