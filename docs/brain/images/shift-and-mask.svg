<text x="680" y="252" font-size="14" text-anchor="middle" font-weight="bold" fill="#000000">4. (run &lt;&lt; 1) &amp; empty</text>
<text x="680" y="270" font-size="12" text-anchor="middle" fill="#333333">the legal move f5</text>
<text x="20" y="302" font-size="13" fill="#000000">Step 3: e5 is a white disc just right of the black d5, so it is in the run; f5 is not white, so the run stops there.</text>
<text x="20" y="322" font-size="13" fill="#000000">Step 4: the square after the run is f5. It is empty, so f5 is a legal move. The same is done for the other 7 directions.</text>
<text x="20" y="342" font-size="13" fill="#000000">Columns a and h (grey) are removed from the mask, so a run can never cross from column h to column a of the next row.</text>
