<text x="20" y="370" font-size="12" fill="#000000">Values are for the player who makes the move. Blue outline: a searched leaf (flag Calculated). Green: a move added by dropout expansion.</text>
<text x="20" y="388" font-size="12" fill="#000000">Step 2 searches 5 positions (the leaf e6 and four best moves not in the book) and backs the values up; step 3 sorts every list best first,</text>
<text x="20" y="406" font-size="12" fill="#000000">so the book now answers d3 with e3 (17), and after d3 c5 it plays e6 (100) instead of the game move f6 (−54).</text>
</svg>
