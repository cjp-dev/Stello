<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" width="800" height="424" font-family="sans-serif">
<title>Book learning in three steps</title>
<desc>Three trees. After AddGame the tiger line has values of plus or minus 32665. After EvaluatePositions the leaf and four new dropout moves are searched and the values are backed up: c5 -100, e3 17. After minimax and sorting, e3 comes first at the root and e6 before f6 after c5.</desc>
<rect x="0" y="0" width="800" height="424" fill="#FFFFFF"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#000000">Book learning on an empty book: the tiger line d3 c5 f6 f5 e6, searched at depth 4</text>
<text x="20" y="54" font-size="14" font-weight="bold" fill="#000000">1. AddGame (Black won)</text>
<text x="20" y="72" font-size="12" fill="#555555">d3 (Black, the root)</text>
