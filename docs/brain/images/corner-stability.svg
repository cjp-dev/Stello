<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 432" width="712" height="432" font-family="sans-serif">
<title>Corner stability</title>
<desc>A board where Black owns a1 with black discs on b1, c1, d1 and a2, a3, a4 along the edges (outlined blue) and b2, c2, b3 inside (outlined red). The three red discs are counted as stable: 3 times 60 is 180 points for Black.</desc>
<rect x="0" y="0" width="712" height="432" fill="#FFFFFF"/>
<text x="62" y="44" font-size="15" text-anchor="middle" fill="#000000">a</text>
<text x="34" y="77" font-size="15" text-anchor="end" fill="#000000">1</text>
<text x="106" y="44" font-size="15" text-anchor="middle" fill="#000000">b</text>
<text x="34" y="121" font-size="15" text-anchor="end" fill="#000000">2</text>
<text x="150" y="44" font-size="15" text-anchor="middle" fill="#000000">c</text>
<text x="34" y="165" font-size="15" text-anchor="end" fill="#000000">3</text>
<text x="194" y="44" font-size="15" text-anchor="middle" fill="#000000">d</text>
<text x="34" y="209" font-size="15" text-anchor="end" fill="#000000">4</text>
<text x="238" y="44" font-size="15" text-anchor="middle" fill="#000000">e</text>
<text x="34" y="253" font-size="15" text-anchor="end" fill="#000000">5</text>
<text x="282" y="44" font-size="15" text-anchor="middle" fill="#000000">f</text>
<text x="34" y="297" font-size="15" text-anchor="end" fill="#000000">6</text>
<text x="326" y="44" font-size="15" text-anchor="middle" fill="#000000">g</text>
<text x="34" y="341" font-size="15" text-anchor="end" fill="#000000">7</text>
<text x="370" y="44" font-size="15" text-anchor="middle" fill="#000000">h</text>
<text x="34" y="385" font-size="15" text-anchor="end" fill="#000000">8</text>
<rect x="40" y="50" width="352" height="352" fill="#1B7F3B" stroke="#0B4D22" stroke-width="2"/>
<line x1="84" y1="50" x2="84" y2="402" stroke="#0B4D22" stroke-width="1"/>
<line x1="40" y1="94" x2="392" y2="94" stroke="#0B4D22" stroke-width="1"/>
<line x1="128" y1="50" x2="128" y2="402" stroke="#0B4D22" stroke-width="1"/>
<line x1="40" y1="138" x2="392" y2="138" stroke="#0B4D22" stroke-width="1"/>
<line x1="172" y1="50" x2="172" y2="402" stroke="#0B4D22" stroke-width="1"/>
<line x1="40" y1="182" x2="392" y2="182" stroke="#0B4D22" stroke-width="1"/>
<line x1="216" y1="50" x2="216" y2="402" stroke="#0B4D22" stroke-width="1"/>
<line x1="40" y1="226" x2="392" y2="226" stroke="#0B4D22" stroke-width="1"/>
<line x1="260" y1="50" x2="260" y2="402" stroke="#0B4D22" stroke-width="1"/>
<line x1="40" y1="270" x2="392" y2="270" stroke="#0B4D22" stroke-width="1"/>
<line x1="304" y1="50" x2="304" y2="402" stroke="#0B4D22" stroke-width="1"/>
<line x1="40" y1="314" x2="392" y2="314" stroke="#0B4D22" stroke-width="1"/>
<line x1="348" y1="50" x2="348" y2="402" stroke="#0B4D22" stroke-width="1"/>
<line x1="40" y1="358" x2="392" y2="358" stroke="#0B4D22" stroke-width="1"/>
<circle cx="62" cy="72" r="17.6" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<circle cx="106" cy="72" r="17.6" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<circle cx="150" cy="72" r="17.6" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<circle cx="194" cy="72" r="17.6" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<circle cx="62" cy="116" r="17.6" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<circle cx="106" cy="116" r="17.6" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<circle cx="150" cy="116" r="17.6" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<circle cx="62" cy="160" r="17.6" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<circle cx="106" cy="160" r="17.6" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<circle cx="62" cy="204" r="17.6" fill="#111111" stroke="#111111" stroke-width="1.5"/>
