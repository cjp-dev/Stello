<rect x="86" y="96" width="40" height="40" fill="none" stroke="#D32F2F" stroke-width="3"/>
<rect x="130" y="96" width="40" height="40" fill="none" stroke="#D32F2F" stroke-width="3"/>
<rect x="86" y="140" width="40" height="40" fill="none" stroke="#D32F2F" stroke-width="3"/>
<rect x="86" y="52" width="40" height="40" fill="none" stroke="#1565C0" stroke-width="3"/>
<rect x="130" y="52" width="40" height="40" fill="none" stroke="#1565C0" stroke-width="3"/>
<rect x="174" y="52" width="40" height="40" fill="none" stroke="#1565C0" stroke-width="3"/>
<rect x="42" y="96" width="40" height="40" fill="none" stroke="#1565C0" stroke-width="3"/>
<rect x="42" y="140" width="40" height="40" fill="none" stroke="#1565C0" stroke-width="3"/>
<rect x="42" y="184" width="40" height="40" fill="none" stroke="#1565C0" stroke-width="3"/>
<text x="422" y="70" font-size="16" font-weight="bold" fill="#000000">Corner stability from a1 (Black)</text>
<text x="422" y="100" font-size="13" fill="#1565C0">Blue: the edge runs from the corner,</text>
<text x="422" y="120" font-size="13" fill="#1565C0">b1–d1 (x = 3) and a2–a4 (y = 3).</text>
<text x="422" y="140" font-size="13" fill="#1565C0">They are scored by the edge tables,</text>
<text x="422" y="160" font-size="13" fill="#1565C0">not counted here.</text>
<text x="422" y="180" font-size="13" fill="#000"></text>
<text x="422" y="200" font-size="13" fill="#D32F2F">Red: the stable discs counted.</text>
<text x="422" y="220" font-size="13" fill="#D32F2F">Step to the diagonal square b2 (1),</text>
<text x="422" y="240" font-size="13" fill="#D32F2F">then up to x − 2 = 1 along the row (c2)</text>
<text x="422" y="260" font-size="13" fill="#D32F2F">and y − 2 = 1 along the column (b3).</text>
<text x="422" y="280" font-size="13" fill="#D32F2F">Now x = y = 1, so the walk stops.</text>
<text x="422" y="300" font-size="13" fill="#000"></text>
<text x="422" y="320" font-size="13" fill="#000000">3 stable discs × 60 = 180 points</text>
<text x="422" y="340" font-size="13" fill="#000000">for Black (−180 for White).</text>
</svg>
